[package]
name = "nori-gui"
version = "0.1.0"
description = "Nori desktop search shell: tray icon, global hotkey, and floating spotlight panel"
edition = "2024"
publish = false

[lib]
name = "nori_gui"
path = "src/lib.rs"

[[bin]]
name = "nori-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-autostart = "2.5.1"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-updater = "2.13.3"
nori-core = { path = "../nori-core" }
nori-cli = { path = "../nori-cli" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects",
                                              "Win32_System_Registry", "Win32_System_SystemInformation",
                                              "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
gtk = "0.18"
zbus = "5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
drag = "2.1.1"
