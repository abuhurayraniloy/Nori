[workspace]
resolver = "2"
members = [
    "crates/nori-core",
    "crates/nori-storage",
    "crates/nori-text",
    "crates/nori-extract",
    "crates/nori-infer",
    "crates/nori-search",
    "crates/nori-crawl",
    "crates/nori-index",
    "crates/nori-cli",
    "crates/nori-gui",
]
default-members = ["crates/nori-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Abu Hurayra Niloy"]

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
